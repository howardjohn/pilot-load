#refresh=true
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{.Name}}
spec:
  hostnames:
  {{range $i := until (int .Hostnames | default 1)}}
    - {{$.Name}}.{{$i}}.example.com
  {{end}}
  parentRefs:
  {{ range $gw := .gateways }}
  {{ $spl := split "/" $gw }}
  - name: {{$spl._1}}
    namespace: {{$spl._0}}
  {{ end }}
  rules:
    - backendRefs:
        - name: {{.Name}}
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /{{.RandNumber}}